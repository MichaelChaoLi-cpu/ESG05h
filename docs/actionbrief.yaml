tableDictionary:
  Table1:
    tableId: Table 1
    tablePath: data/results/tables/Table1_DescriptiveStats.xlsx
    tableCaption: Descriptive Statistics for Key Variables.
    tableAim: Characterise the distribution of outcome, disclosure, and control variables.
    tableExplanation: Rows = variables (7 match scores, 7 pos_mean, 7 neg_mean, sentiment, logMC, ΔlogMC, ROA, leverage, R&D
      share, IBES rec). Columns = N, mean, SD, min, p25, p50, p75, max.
    tableSuitableSection: Data and Measurement
  Table2:
    tableId: Table 2
    tablePath: data/results/tables/Table2_CrossTopic_Summary.xlsx
    tableCaption: 'Cross-Topic Coefficient Summary: M1/M2/M3 for all 7 Business Topics.'
    tableAim: Provide a compact overview of all 21 baseline regression coefficients.
    tableExplanation: 'Rows = 5 coefficient types (M1 match; M2 match, sentiment; M3 pos_mean, neg_mean). Columns = 7 Business
      topics. β and SE shown; stars: * p<0.10, ** p<0.05, *** p<0.01.'
    tableSuitableSection: Results — Baseline Association
  Table3:
    tableId: Table 3
    tablePath: data/results/tables/Table3_Mechanism_InfoChannel.xlsx
    tableCaption: 'Descriptive Test 1: Information Channel — Baseline vs. Fundamentals-Controlled M1.'
    tableAim: Assess same-sample sensitivity to lagged ROA and leverage.
    tableExplanation: 'Coefficient attenuation is not a causal proportion and no arbitrary threshold establishes a channel.
      Joint company and year fixed effects: outcome, regressors and year indicators are projected off company indicators.
      Company-clustered CR1 uses full-model residual degrees of freedom; p-values use t(G-1). Within R² includes year effects
      relative to the company-demeaned outcome. Plot intervals are normal-approximation 95% intervals (coefficient +/- 1.96
      SE).'
    tableSuitableSection: Results — Mechanism Tests
  Table4:
    tableId: Table 4
    tablePath: data/results/tables/Table4_Mechanism_IBESMediation.xlsx
    tableCaption: 'Descriptive Test 2: Analyst Attention Channel (Baron-Kenny IBES Recommendation Comparison).'
    tableAim: Assess associations with analyst recommendations and same-sample adjustment.
    tableExplanation: 'Stage 1 uses current recommendations; stage 2 controls lagged recommendations. Different timing and
      samples do not identify mediation. Recommendations measure assessment, not attention. Joint company and year fixed effects:
      outcome, regressors and year indicators are projected off company indicators. Company-clustered CR1 uses full-model
      residual degrees of freedom; p-values use t(G-1). Within R² includes year effects relative to the company-demeaned outcome.
      Plot intervals are normal-approximation 95% intervals (coefficient +/- 1.96 SE).'
    tableSuitableSection: Results — Mechanism Tests
  Table5:
    tableId: Table 5
    tablePath: data/results/tables/Table5_Mechanism_SignalDirection.xlsx
    tableCaption: 'Descriptive Test 3: M3 Signal Direction Summary.'
    tableAim: Describe signed positive and negative score coefficients.
    tableExplanation: 'Negative Mean is signed: a more negative value is a decrease. Pattern labels describe coefficient signs,
      not established mechanisms. Joint company and year fixed effects: outcome, regressors and year indicators are projected
      off company indicators. Company-clustered CR1 uses full-model residual degrees of freedom; p-values use t(G-1). Within
      R² includes year effects relative to the company-demeaned outcome. Plot intervals are normal-approximation 95% intervals
      (coefficient +/- 1.96 SE).'
    tableSuitableSection: Results — Mechanism Tests
  Table6:
    tableId: Table 6
    tablePath: data/results/tables/Table6_Mechanism_ROAQuartile.xlsx
    tableCaption: 'Descriptive Test 4: ROA Quartile Heterogeneity.'
    tableAim: Explore associations across contemporaneous ROA quartiles.
    tableExplanation: 'Current ROA groups can change over time. Separate significance does not establish between-group differences.
      Joint company and year fixed effects: outcome, regressors and year indicators are projected off company indicators.
      Company-clustered CR1 uses full-model residual degrees of freedom; p-values use t(G-1). Within R² includes year effects
      relative to the company-demeaned outcome. Plot intervals are normal-approximation 95% intervals (coefficient +/- 1.96
      SE).'
    tableSuitableSection: Results — Mechanism Tests
  Table7:
    tableId: Table 7
    tablePath: data/results/tables/Table7_IdentificationRobustness.xlsx
    tableCaption: 'Identification Robustness: M1 Match Coefficient across Six Checks.'
    tableAim: Assess alternative timing, outcomes and sample definitions.
    tableExplanation: 'R0 is baseline plus five alternatives. Longer lags do not rule out reverse causality; growth is a different
      outcome. Joint company and year fixed effects: outcome, regressors and year indicators are projected off company indicators.
      Company-clustered CR1 uses full-model residual degrees of freedom; p-values use t(G-1). Within R² includes year effects
      relative to the company-demeaned outcome. Plot intervals are normal-approximation 95% intervals (coefficient +/- 1.96
      SE).'
    tableSuitableSection: Results — Identification
  Table8:
    tableId: Table 8
    tablePath: data/results/tables/Table8_SectorHet_M1.xlsx
    tableCaption: 'Sector Heterogeneity: M1 Relatedness by GICS Sector.'
    tableAim: Explore topic associations within industries; no confirmed sector rankings.
    tableExplanation: 'Exploratory comparisons involve multiple testing and some small company clusters. No adjusted p-values
      or formal between-sector contrasts are reported. Joint company and year fixed effects: outcome, regressors and year
      indicators are projected off company indicators. Company-clustered CR1 uses full-model residual degrees of freedom;
      p-values use t(G-1). Within R² includes year effects relative to the company-demeaned outcome. Plot intervals are normal-approximation
      95% intervals (coefficient +/- 1.96 SE).'
    tableSuitableSection: Results — Sector Heterogeneity
  Table9:
    tableId: Table 9
    tablePath: data/results/tables/Table9_SectorHet_M3.xlsx
    tableCaption: 'Sector Heterogeneity: M3 Positive and Negative Mean by GICS Sector.'
    tableAim: Explore topic associations within industries; no confirmed sector rankings.
    tableExplanation: 'Exploratory comparisons involve multiple testing and some small company clusters. No adjusted p-values
      or formal between-sector contrasts are reported. Joint company and year fixed effects: outcome, regressors and year
      indicators are projected off company indicators. Company-clustered CR1 uses full-model residual degrees of freedom;
      p-values use t(G-1). Within R² includes year effects relative to the company-demeaned outcome. Plot intervals are normal-approximation
      95% intervals (coefficient +/- 1.96 SE).'
    tableSuitableSection: Results — Sector Heterogeneity
