analysisStructureBrief:
  overview: 'Conditional associations between seven Business-topic disclosure measures and market capitalization in Japanese
    listed companies, 2016–2025. Relatedness is normalized semantic alignment, not absolute disclosure volume. M3 is an alternative
    specification and does not control for Relatedness. Fundamentals and analyst comparisons are descriptive sensitivity analyses;
    subgroup analyses are exploratory. Neither attenuation nor longer lags identify a causal mechanism. Joint company and
    year fixed effects: outcome, regressors and year indicators are projected off company indicators. Company-clustered CR1
    uses full-model residual degrees of freedom; p-values use t(G-1). Within R² includes year effects relative to the company-demeaned
    outcome. Plot intervals are normal-approximation 95% intervals (coefficient +/- 1.96 SE).'
  levels:
  - levelName: Data Preparation
    levelAim: Construct exact calendar-year lags and annual market-capitalization changes.
    inputs:
    - match_scores.csv
    - tendency_scores.csv
    - sentiment_scores.csv
    - Market_cap_annual.xlsx
    - annual_financial_raw.xlsx
    - IBES_monthly_raw.xlsx
    - MSCI_category_Japan_listed_companies.xlsx
    - Japan_interest_rate_annual.xlsx
    modelOrMethod: Merge on (stock_code, year); lag ESG and control variables by 1 year and 2 years; compute log MC and ΔlogMC.
    outputs:
    - data/processed/panel.parquet (37,272 obs × 328 cols)
    interpretation: Missing prior calendar years produce missing lags; a prior row is not a prior year.
  - levelName: Part I — Baseline Association (M1/M2/M3)
    levelAim: Compare separate topic associations under M1, M2 and alternative M3.
    inputs:
    - panel.parquet
    - ENV_TOPICS (7 Business topics)
    modelOrMethod: 'Joint company and year fixed effects: outcome, regressors and year indicators are projected off company
      indicators. Company-clustered CR1 uses full-model residual degrees of freedom; p-values use t(G-1). Within R² includes
      year effects relative to the company-demeaned outcome. Plot intervals are normal-approximation 95% intervals (coefficient
      +/- 1.96 SE).'
    outputs:
    - Table 2 (cross-topic summary)
    - Tables S1–S7 (per-topic)
    - Figure 5 (coefficient plots)
    interpretation: 'Separate-topic regressions do not identify independent topic contributions. Joint company and year fixed
      effects: outcome, regressors and year indicators are projected off company indicators. Company-clustered CR1 uses full-model
      residual degrees of freedom; p-values use t(G-1). Within R² includes year effects relative to the company-demeaned outcome.
      Plot intervals are normal-approximation 95% intervals (coefficient +/- 1.96 SE).'
  - levelName: 'Part II — Descriptive Comparison 1: Information Channel'
    levelAim: Assess same-sample sensitivity to lagged ROA and leverage.
    inputs:
    - panel.parquet
    - roa_pct_lag1
    - ltdebt_assets_pct_lag1
    modelOrMethod: TWFE M1 on identical sample with and without ROA + LT leverage controls. Attenuation % = (1 − |β_ctrl/β_base|)
      × 100.
    outputs:
    - Table 3 (attenuation summary)
    - Figure 6 (before/after forest plot)
    interpretation: Coefficient attenuation is not a causal proportion and no arbitrary threshold establishes a channel.
  - levelName: 'Part II — Descriptive Comparison 2: Analyst Recommendation Comparison'
    levelAim: Assess associations with analyst recommendations and same-sample adjustment.
    inputs:
    - panel.parquet
    - ibes_rec_mean
    - ibes_rec_mean_lag1
    modelOrMethod: 'S1: relatedness(t-1) and recommendation(t); S2a: relatedness(t-1) and logMC(t); S2b adds recommendation(t-1)
      on the same S2 sample.'
    outputs:
    - Table 4 (mediation summary)
    - Figure 7 (S2a vs S2b forest plot)
    interpretation: Stage 1 uses current recommendations; stage 2 controls lagged recommendations. Different timing and samples
      do not identify mediation. Recommendations measure assessment, not attention.
  - levelName: 'Part II — Descriptive Comparison 3: Signal Direction (M3 Asymmetry)'
    levelAim: Describe signed positive and negative score coefficients.
    inputs:
    - panel.parquet
    - tend_{topic}_pos_mean_lag1
    - tend_{topic}_neg_mean_lag1
    modelOrMethod: M3 includes positive and signed negative mean scores, without Relatedness or Overall Sentiment.
    outputs:
    - Table 5 (pattern classification)
    - Figure 8 (grouped bar chart)
    interpretation: 'Negative Mean is signed: a more negative value is a decrease. Pattern labels describe coefficient signs,
      not established mechanisms.'
  - levelName: 'Part II — Descriptive Comparison 4: ROA Quartile Heterogeneity'
    levelAim: Explore associations across contemporaneous ROA quartiles.
    inputs:
    - panel.parquet
    - roa_pct (within-year quartile split)
    modelOrMethod: TWFE M1 estimated separately per within-year ROA quartile per topic.
    outputs:
    - Table 6 (quartile results)
    - Figure 9 (quartile forest plot)
    interpretation: Current ROA groups can change over time. Separate significance does not establish between-group differences.
  - levelName: Part III — Specification Sensitivity
    levelAim: Assess alternative timing, outcomes and sample definitions.
    inputs:
    - panel.parquet
    - match_{topic}_lag1
    - match_{topic}_lag2
    modelOrMethod: 'Six checks: R0 baseline (t-1), R1 t-2 lag, R2 ΔlogMC outcome, R3 exclude 2020, R4 balanced panel, R5 winsorised
      ΔlogMC.'
    outputs:
    - Table 7 (robustness summary)
    - Figure 10 (robustness forest plot)
    interpretation: R0 is baseline plus five alternatives. Longer lags do not rule out reverse causality; growth is a different
      outcome.
  - levelName: Part IV — Sector Heterogeneity
    levelAim: Explore topic associations within industries; no confirmed sector rankings.
    inputs:
    - panel.parquet
    - sector (11 GICS sectors)
    modelOrMethod: TWFE M1 and M3 estimated separately within each sector for each of 7 Business topics (11 × 7 × 2 = 154
      models).
    outputs:
    - Table 8 (M1 sector)
    - Table 9 (M3 sector)
    - Figure 11 (M1 sector forest plot)
    interpretation: Exploratory comparisons involve multiple testing and some small company clusters. No adjusted p-values
      or formal between-sector contrasts are reported.
